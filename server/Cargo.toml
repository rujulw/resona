[package]
name = "resona-server"
version = "0.1.0"
description = "Tauri shell and Rust core for resona"
authors = ["resona"]
edition = "2021"

[lib]
name = "resona_server_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
